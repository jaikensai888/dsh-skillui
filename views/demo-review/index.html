<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo Skill UI</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f5;
        color: #1f2933;
      }
      @media (prefers-color-scheme: dark) {
        :root { background: #17191c; color: #eef1f4; }
        .card { background: #22262b; border-color: #343a40; }
        .muted { color: #aab2bb; }
      }
      body { margin: 0; min-width: 240px; }
      main { box-sizing: border-box; max-width: 720px; margin: 0 auto; padding: 24px; }
      .eyebrow { color: #6b7280; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
      h1 { font-size: 22px; margin: 8px 0 4px; }
      p { line-height: 1.55; }
      .muted { color: #6b7280; font-size: 13px; }
      .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; margin-top: 18px; padding: 18px; }
      .identity { display: grid; gap: 8px; grid-template-columns: 110px 1fr; font-size: 13px; }
      .identity code { overflow-wrap: anywhere; }
      .metric { align-items: center; display: flex; gap: 14px; margin: 22px 0; }
      .count { font-size: 44px; font-variant-numeric: tabular-nums; font-weight: 700; line-height: 1; }
      button { background: #2563eb; border: 0; border-radius: 9px; color: white; cursor: pointer; font: inherit; padding: 9px 14px; }
      button.secondary { background: transparent; border: 1px solid #9ca3af; color: inherit; }
      button:disabled { cursor: wait; opacity: .55; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; }
      .status { color: #047857; font-size: 13px; }
      .error { color: #b91c1c; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Skill UI · Demo</div>
      <h1>招聘流程交互演示</h1>
      <p class="muted">这是通用 Skill UI 桥接的 Demo，不包含真实招聘业务。按钮操作会进入宿主事件日志，并按 Session / Workflow 隔离。</p>

      <section class="card">
        <div class="identity">
          <strong>Session</strong><code id="session-id">-</code>
          <strong>Skill</strong><code id="skill-id">-</code>
          <strong>Workflow</strong><code id="workflow-id">-</code>
        </div>
      </section>

      <section class="card">
        <div class="muted">已处理候选人（Demo count）</div>
        <div class="metric"><div class="count" id="count">0</div><div class="status" id="status">读取状态中…</div></div>
        <div class="actions">
          <button id="increment">标记已处理</button>
          <button class="secondary" id="reset">重置演示</button>
        </div>
        <p class="muted" id="transport">Transport: dsh-skillui HTTP bridge</p>
      </section>
    </main>

    <script>
      (() => {
        const query = new URLSearchParams(window.location.search)
        const identity = {
          sessionId: query.get('sessionId') || '',
          skillId: query.get('skillId') || '',
          workflowId: query.get('workflowId') || '',
        }
        const identityKey = [identity.sessionId, identity.skillId, identity.workflowId].join('/')
        const stateUrl = `/skillui/api/state?${new URLSearchParams(identity).toString()}`
        const commandUrl = '/skillui/api/command'
        let visible = true
        let timer = null
        let requestNumber = 0

        document.getElementById('session-id').textContent = identity.sessionId || '(missing)'
        document.getElementById('skill-id').textContent = identity.skillId || '(missing)'
        document.getElementById('workflow-id').textContent = identity.workflowId || '(missing)'

        function setStatus(text, error) {
          const node = document.getElementById('status')
          node.textContent = text
          node.classList.toggle('error', Boolean(error))
        }

        async function refresh() {
          if (!visible) return
          try {
            const response = await fetch(stateUrl, { cache: 'no-store' })
            if (!response.ok) throw new Error(`state_${response.status}`)
            const state = await response.json()
            document.getElementById('count').textContent = String(state.count)
            setStatus(state.lastCommand ? `最近操作：${state.lastCommand}` : '等待操作')
          } catch (error) {
            setStatus(`读取失败：${error.message}`, true)
          }
        }

        async function dispatch(type) {
          const buttons = document.querySelectorAll('button')
          buttons.forEach((button) => { button.disabled = true })
          try {
            const response = await fetch(commandUrl, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ identity, command: { type, requestId: `${identityKey}:${++requestNumber}` } }),
            })
            if (!response.ok) throw new Error(`command_${response.status}`)
            const state = await response.json()
            document.getElementById('count').textContent = String(state.count)
            setStatus(`已执行：${type}`)
          } catch (error) {
            setStatus(`操作失败：${error.message}`, true)
          } finally {
            buttons.forEach((button) => { button.disabled = false })
          }
        }

        document.getElementById('increment').addEventListener('click', () => dispatch('demo.increment'))
        document.getElementById('reset').addEventListener('click', () => dispatch('demo.reset'))

        window.addEventListener('message', (event) => {
          if (event.source !== window.parent || event.origin !== window.location.origin) return
          const message = event.data
          if (message?.type !== 'dsh-skillui:visibility' || message.identityKey !== identityKey) return
          visible = Boolean(message.visible)
          if (visible) {
            refresh()
            timer = window.setInterval(refresh, 5000)
          } else if (timer !== null) {
            window.clearInterval(timer)
            timer = null
          }
        })

        refresh()
        timer = window.setInterval(refresh, 5000)
      })()
    </script>
  </body>
</html>
